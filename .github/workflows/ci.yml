name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v1
        with:
          args: check .
      - uses: astral-sh/ruff-action@v1
        with:
          args: format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest PyQt6 pyvista pyvistaqt numpy-stl matplotlib
      - name: Run unit tests
        run: python -m pytest test_solver.py -q -m "not validation"
      - name: Run validation tests
        run: python -m pytest test_solver.py -q -m validation
      - name: Sweep smoke test
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from validation.sphere_stl import sphere_stl, write_binary_stl
          v, i, j, k = sphere_stl(0.25, (-1.0, 0.0, 0.0), n_lat=24, n_lon=32)
          write_binary_stl('/tmp/sphere_ci.stl', v, i, j, k)
          "
          python sweep.py --stl /tmp/sphere_ci.stl --wind 10 --yaw 0 --fluid air \
            --res 30x15x15 --iters 5 --out /tmp/sweep_ci
